<!-- src/app/components/product-card/product-card.component.html -->
<mat-card class="product-card">
  <img mat-card-image [src]="product.image" alt="{{ product.title }}" />
  <mat-card-title>{{ product.title }}</mat-card-title>
  <mat-card-content>
    <p>{{ product.description }}</p>
    <p>Price: ${{ product.price }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button color="primary" (click)="onAddToCart()">Add to Cart</button>
  </mat-card-actions>
</mat-card>
