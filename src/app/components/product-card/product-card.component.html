<mat-card class="product-card">
  <div class="image-container">
    <img mat-card-image [src]="product.image" alt="{{ product.title }}" />
  </div>
  <mat-card-title class="product-title">
    {{ product.title | slice: 0:50 }}{{ product.title.length > 50 ? '...' : '' }}
  </mat-card-title>
  <mat-card-content>
    <p class="product-description">
      {{ product.description | slice: 0:150 }}{{ product.description.length > 150 ? '...' : '' }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <p class="product-price">Price: ${{ product.price }}</p>
    <button mat-raised-button color="primary" (click)="onAddToCart()">Add to Cart</button>
  </mat-card-actions>
</mat-card>
