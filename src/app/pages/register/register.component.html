<mat-card class="auth-card">
  <div class="brand">
    <span class="brand-pill">ITXIStore</span>
    <span class="brand-tagline">Commerce + Weather Console</span>
  </div>
  <div class="card-header">
    <h2>Create your account</h2>
    <p>Join ITXIStore to unlock personalized carts and role access.</p>
  </div>
  <div class="card-meta">
    <span class="meta-chip">Quick setup</span>
    <span class="meta-chip">Verified email</span>
    <span class="meta-chip">Flexible roles</span>
  </div>
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        Valid email is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-error *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        Password is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">Register</button>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
  <p class="helper-text">Already have an account? <a routerLink="/login">Login here</a></p>
</mat-card>
