<!-- Search Bar -->
<app-search-bar (searchChange)="searchQuery.set($event)"></app-search-bar>

<!-- Product Cards -->
<div class="products-container">
  <app-product-card
    *ngFor="let product of paginatedProducts"
    [product]="product"
    (addToCart)="addToCart(product)"
  ></app-product-card>
</div>

<div
  class="no-products"
  *ngIf="searchQuery().trim().length > 0 && paginatedProducts.length === 0"
>
  No products found
</div>

<!-- Load More Button -->
<div
  class="load-more-container"
  *ngIf="
    productService.hasMore &&
    (searchQuery().trim().length === 0 || paginatedProducts.length > 0)
  "
>
  <button class="load-more-btn" (click)="loadMoreProducts()">
    Load More
  </button>
</div>
