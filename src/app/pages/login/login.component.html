<mat-card class="auth-card">
  <div class="brand">
    <span class="brand-pill">ITXIStore</span>
    <span class="brand-tagline">Commerce + Weather Console</span>
  </div>
  <div class="card-header">
    <h2>Welcome back</h2>
    <p>Sign in to manage products, weather, and user access.</p>
  </div>
  <div class="card-meta">
    <span class="meta-chip">Secure auth</span>
    <span class="meta-chip">Role-based</span>
    <span class="meta-chip">Live updates</span>
  </div>
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        Valid email is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Password is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Login</button>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
  <p class="helper-text">Don't have an account? <a routerLink="/register">Register here</a></p>
</mat-card>
